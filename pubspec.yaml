name: lmcode
description: "Local LLM coding assist for desktop (Flutter)."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# SPDX-License-Identifier: Apache-2.0

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  go_router: ^17.4.0
  # 新規追加：APIキー等の端末内セキュア保存（Drive OAuth 等）
  flutter_secure_storage: ^9.2.4
  # 新規追加：非シークレット設定の永続化
  shared_preferences: ^2.5.3
  # 新規追加：APIキーを .env.* から読込
  flutter_dotenv: ^5.2.1
  # 新規追加：設定画面のバージョン表示
  package_info_plus: ^8.3.0
  # 新規追加：AmiVoice WebSocket 通信
  web_socket_channel: ^3.0.3
  # 新規追加：マイク録音（実機テストは後続）
  record: ^6.0.0
  # 新規追加：Gemini 生成AI
  google_generative_ai: ^0.4.7
  # 新規追加：Ollama ローカル HTTP
  http: ^1.6.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^11.0.3
  excel_plus: ^2.23.0
  archive: ^4.3.0
  share_plus: ^12.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.4.7
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  desktop_drop: ^0.8.4
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_widget_from_html_core: ^0.17.4
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  intl: ^0.20.3
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # アプリアイコン生成（document/iconImage → 各プラットフォーム）
  flutter_launcher_icons: ^0.14.4

# flutter_launcher_icons 設定
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: false
  ios: false
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: false
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/env/
    - LICENSE
    - NOTICE
